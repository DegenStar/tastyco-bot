[project]
name = "tastyco-bot"
version = "0.1.0"
description = "TastyCo wallet account automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cloudscraper==1.2.71",
    "colorama==0.4.6",
    "eth-account==0.13.7",
    "eth-utils==5.3.0",
    "requests[socks]>=2.32.5,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ASYNC"]
